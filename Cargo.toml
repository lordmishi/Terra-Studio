[package]
name = "terra-studio"
version = "2.9.0"
edition = "2021"
description = "Terra Studio: YouTube channel toolkit (ideas, scripts, SEO, thumbnails, Studio analytics) powered by Claude"

[[bin]]
name = "TerraStudio"
path = "src/main.rs"

[[bin]]
name = "TerraMCP"
path = "src/mcp.rs"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json", "native-certs", "proxy-from-env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tao = "0.30"
wry = "0.47"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[build-dependencies]
embed-resource = "3"
